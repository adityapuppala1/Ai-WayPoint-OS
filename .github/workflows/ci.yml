name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Safety evaluations (release gates)
        run: pnpm eval
      - name: Bundle the phone app (iOS and Android, Hermes)
        run: pnpm --filter @waypoint/mobile export
        env:
          CI: '1'
          EXPO_PUBLIC_WAYPOINT_URL: https://waypoint.example
      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production-use-000000
          WAYPOINT_KEK: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
