name: Security

# Runs on every change and once a week, so a newly published vulnerability in a library that
# is already in use is caught even when nobody has touched the code. Findings fail the run;
# dependency fixes arrive as pull requests (see .github/dependabot.yml) and go in only once
# the full CI (tests, safety evaluations, build) passes on them.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Production dependencies only; high and critical advisories fail the run.
      - run: pnpm audit --prod --audit-level=high

  secrets:
    name: No secrets in the repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The whole history, not just the latest commit: a key removed later is still exposed.
      - name: Scan with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  code:
    name: Code analysis (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
