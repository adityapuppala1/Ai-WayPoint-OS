# An example only — it is not part of the kustomization, and these values are placeholders
# that a production server refuses (too short, or not a key). Create the real Secret from
# your own values, preferably with your cluster's secret manager (External Secrets, Sealed
# Secrets, SOPS…) rather than a file:
#
#   kubectl -n waypoint create secret generic waypoint-secrets \
#     --from-literal=DATABASE_URL='postgres://waypoint:…@db.internal:5432/waypoint?sslmode=require' \
#     --from-literal=BETTER_AUTH_SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")" \
#     --from-literal=WAYPOINT_KEK="$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")"
#
# Keep a copy of WAYPOINT_KEK somewhere safe and separate from database backups: without it,
# nothing people wrote privately can ever be read again.
apiVersion: v1
kind: Secret
metadata:
  name: waypoint-secrets
type: Opaque
stringData:
  # Postgres with the pgvector and pg_trgm extensions. Use TLS (sslmode=require or stricter).
  DATABASE_URL: "postgres://waypoint:REPLACE_ME@db.internal:5432/waypoint?sslmode=require"
  # Signs sessions, links and approvals. At least 32 characters; a production server refuses less.
  BETTER_AUTH_SECRET: "REPLACE_ME"
  # 32 random bytes, base64. Wraps every person's own data key.
  WAYPOINT_KEK: "REPLACE_ME"
  # When rotating the key above, the old one goes here until every row is re-wrapped.
  # WAYPOINT_KEK_PREVIOUS: ""
  # Optional — email (one of), AI (any one), texting providers. See .env.example for all names.
  # EMAIL_FROM: "Waypoint <hello@waypoint.example.org>"
  # SMTP_URL: "smtps://user:password@mail.example.org:465"
  # RESEND_API_KEY: ""
  # ANTHROPIC_API_KEY: ""
  # WAYPOINT_ADMIN_EMAIL: ""
  # WAYPOINT_ADMIN_PASSWORD: ""
