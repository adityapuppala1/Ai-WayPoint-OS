# Background work: follow-ups after a hard moment, reminders, queued email and texts, weekly
# totals for organisations, and retention. Safe to run more than one: every task claims its
# work with row locks or can be repeated.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waypoint-worker
  labels:
    app.kubernetes.io/name: waypoint-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: waypoint-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start the new worker before stopping the old one: queued messages keep going out.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: waypoint-worker
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      # The worker finishes the round in progress before it stops (up to 25 seconds):
      # stopping mid-send would send the same messages again ten minutes later.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: waypoint-worker
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: waypoint-config
            - secretRef:
                name: waypoint-secrets
          env:
            # Seconds between rounds, in milliseconds.
            - name: WORKER_INTERVAL_MS
              value: "30000"
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
